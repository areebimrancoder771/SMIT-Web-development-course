<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    
</head>
<body>
    <div id="container">
      <div id="left-box">
        <img src="img/pngwing.com (6).png" alt="" id="fb-logo">
        <h1>Explore the things <span id="blue"> you love.</span></h1>
        <div>
            <img src="img/Screenshot 2026-09-26 175755.jpg" alt="" width="200px" height="200px">
        </div>
      </div>
      <div id="Right-box">

        <h1>Log in to Facebook</h1>

        <form id="input-forms">

          <div id="email">
            <input type="email" placeholder="Email address or mobile number ">
          </div>

          <div id="password">
            <input type="password" placeholder="Password ">
          </div>

          <div id="login-button"><button>
            Log in 

          </button></div>

          <div id="forgot-password"><button>
            Forgot Password ?
          </button></div>
        
        <div id="new-acc"><button>
            Create new account 
          </button></div>

        </form>
      
    </div>
    
</body>
</html>
